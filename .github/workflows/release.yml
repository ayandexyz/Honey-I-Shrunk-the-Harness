name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.32.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build + publish binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Bun bundles core from its built dist, so shared + core must compile
      # first. web-app is not bundled into the binary — build-bun.mjs copies
      # its dist beside the executable as `web-ui/`, which is what serves the
      # browser and every phone client. Skip it and the binary 404s on `/`.
      - name: Build shared + core + web UI
        run: |
          pnpm --filter @thisisayande/freecode-shared build
          pnpm --filter @thisisayande/freecode-core build
          pnpm --filter web-app build

      # One Linux runner cross-compiles every target thanks to `bun --target`.
      # Each target builds into its own staging dir — build-bun.mjs copies the
      # onnxruntime shared lib(s) the memory graph embedder needs next to the
      # binary there, so a flat shared `out/` would let later targets clobber
      # earlier ones' same-named libs (e.g. every Linux arch ships
      # libonnxruntime.so.1). The staging dir is then archived as one download
      # so installers get the binary and its sidecar libs together.
      - name: Compile binaries
        run: |
          set -euo pipefail
          root="$PWD"
          mkdir -p out
          declare -A TARGETS=(
            [bun-linux-x64]=freecode-linux-x86_64
            [bun-linux-arm64]=freecode-linux-aarch64
            [bun-darwin-x64]=freecode-macos-x86_64
            [bun-darwin-arm64]=freecode-macos-aarch64
            [bun-windows-x64]=freecode-windows-x86_64
          )
          RG_VERSION=15.2.0
          declare -A RG_TRIPLES=(
            [bun-linux-x64]=x86_64-unknown-linux-musl
            [bun-linux-arm64]=aarch64-unknown-linux-musl
            [bun-darwin-x64]=x86_64-apple-darwin
            [bun-darwin-arm64]=aarch64-apple-darwin
            [bun-windows-x64]=x86_64-pc-windows-msvc
          )
          for target in "${!TARGETS[@]}"; do
            name="${TARGETS[$target]}"
            stage="$PWD/stage/$name"
            mkdir -p "$stage"
            bin="freecode"
            [[ "$target" == *windows* ]] && bin="freecode.exe"
            echo "::group::$name ($target)"
            FREECODE_BUN_TARGET="$target" \
            FREECODE_BUN_OUTFILE="$stage/$bin" \
              node scripts/build-bun.mjs
            # ripgrep rides beside the binary (tools/grep.ts ripgrepPath), as
            # Claude Code vendors it: without it every `grep` call fails.
            rg_pkg="ripgrep-$RG_VERSION-${RG_TRIPLES[$target]}"
            rg_url="https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$rg_pkg"
            if [[ "$target" == *windows* ]]; then
              curl -fsSL -o rg.zip "$rg_url.zip"
              unzip -q -j rg.zip "$rg_pkg/rg.exe" -d "$stage" && rm rg.zip
            else
              curl -fsSL "$rg_url.tar.gz" | tar -xz -C "$stage" --strip-components=1 "$rg_pkg/rg"
            fi
            if [[ "$target" == *windows* ]]; then
              ( cd "$stage" && zip -q -r "$root/out/$name.zip" . )
            else
              tar -czf "$root/out/$name.tar.gz" -C "$stage" .
            fi
            echo "::endgroup::"
          done

      # Optional graph explorer UI addon (~280 KB). Not bundled into the
      # binary — users opt in via `freecode memory ui-install`, which fetches
      # this asset and extracts it into ~/.freecode/addons/graph-ui/. Tared
      # into `out/` so the existing `gh release upload out/*` workflow picks
      # it up alongside the platform archives and the SHA256SUMS manifest.
      - name: Bundle graph UI addon
        run: |
          set -euo pipefail
          tar -czf out/graph-ui.tar.gz -C apps/core/src/graph-explorer page
          ls -lh out

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          ( cd out && sha256sum * > SHA256SUMS )
          ls -lh out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            out/* \
          || gh release upload "${RELEASE_TAG}" out/* --clobber
